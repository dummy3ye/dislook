name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Lint, format and typecheck once is enough, so only on the newest Node.
      - name: Typecheck, lint, format
        if: matrix.node == 22
        run: npm run check

      # vitest needs Node 20+, Node 18 is still covered by the smoke tests below.
      - name: Unit tests
        if: matrix.node != 18
        run: npm test

      - name: Build
        run: npm run build

      - name: Shebang is correct
        run: head -n 1 dist/dislook.js | grep -qx '#!/usr/bin/env node'

      - name: Smoke test (offline decode)
        run: node dist/dislook.js 208265082977648640 --offline

      - name: Smoke test (JSON output)
        run: |
          node dist/dislook.js 208265082977648640 -o -j | grep -q '"created": "2016-07'

      - name: Package contents
        run: npm pack --dry-run
